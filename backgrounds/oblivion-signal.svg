<svg xmlns="http://www.w3.org/2000/svg" width="5120" height="1440" viewBox="0 0 5120 1440">
  <defs>
    <!-- Small dots at every 18px intersection -->
    <pattern id="dots" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="0.5" fill="#6FA8CC" opacity="0.05"/>
    </pattern>
    <!-- Larger balls at every 3rd intersection (54px) — varying dot sizes -->
    <pattern id="balls" x="0" y="0" width="54" height="54" patternUnits="userSpaceOnUse">
      <circle cx="27" cy="27" r="1" fill="#6FA8CC" opacity="0.10"/>
    </pattern>
    <!-- Thin interrupted hairlines — 12px on, 6px off -->
    <pattern id="thin-lines" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="12" y2="0" stroke="#2C4A61" stroke-width="0.3" opacity="0.03"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#2C4A61" stroke-width="0.3" opacity="0.03"/>
    </pattern>
    <!-- Thicker lines at 3x spacing — the "thick sections" -->
    <pattern id="thick-lines" x="0" y="0" width="54" height="54" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="54" y2="0" stroke="#2C4A61" stroke-width="0.6" opacity="0.06"/>
      <line x1="0" y1="0" x2="0" y2="54" stroke="#2C4A61" stroke-width="0.6" opacity="0.06"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0D141C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05080C" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <!-- Void background -->
  <rect width="5120" height="1440" fill="#080D13"/>

  <!-- Dot lattice: small dots, thin interrupted lines, thick lines, large balls -->
  <rect width="5120" height="1440" fill="url(#dots)"/>
  <rect width="5120" height="1440" fill="url(#thin-lines)"/>
  <rect width="5120" height="1440" fill="url(#thick-lines)"/>
  <rect width="5120" height="1440" fill="url(#balls)"/>

  <!-- Faint reticle in upper-right area -->
  <g transform="translate(4000, 400)" opacity="0.08">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#2C4A61" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#2C4A61" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#2C4A61" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#2C4A61" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#A3CFE3" stroke-width="0.8"/>
    <line x1="0" y1="-200" x2="0" y2="200" stroke="#2C4A61" stroke-width="0.3"/>
    <line x1="-200" y1="0" x2="200" y2="0" stroke="#2C4A61" stroke-width="0.3"/>
    <line x1="0" y1="-200" x2="0" y2="-190" stroke="#6FA8CC" stroke-width="1"/>
    <line x1="-200" y1="0" x2="-190" y2="0" stroke="#6FA8CC" stroke-width="1"/>
    <line x1="190" y1="0" x2="200" y2="0" stroke="#6FA8CC" stroke-width="1"/>
    <path d="M 0 0 L 0 -140 A 140 140 0 0 1 140 0 Z" fill="#6FA8CC" fill-opacity="0.05" stroke="#6FA8CC" stroke-width="0.3" opacity="0.3"/>
    <circle cx="50" cy="-40" r="12" fill="none" stroke="#A6455C" stroke-width="0.5" opacity="0.5"/>
    <line x1="38" y1="-52" x2="62" y2="-28" stroke="#A6455C" stroke-width="0.3" opacity="0.3"/>
    <line x1="62" y1="-52" x2="38" y2="-28" stroke="#A6455C" stroke-width="0.3" opacity="0.3"/>
  </g>

  <!-- Faint coordinate marks in lower-left -->
  <g transform="translate(120, 1200)" opacity="0.1">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#2C4A61" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#2C4A61" stroke-width="0.5"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#2C4A61" stroke-width="0.5"/>
    <line x1="50" y1="-3" x2="50" y2="3" stroke="#2C4A61" stroke-width="0.3"/>
    <line x1="100" y1="-3" x2="100" y2="3" stroke="#2C4A61" stroke-width="0.3"/>
    <line x1="150" y1="-3" x2="150" y2="3" stroke="#2C4A61" stroke-width="0.3"/>
    <line x1="200" y1="-4" x2="200" y2="4" stroke="#2C4A61" stroke-width="0.5"/>
    <text x="0" y="16" font-family="monospace" font-size="8" fill="#5F7F93" opacity="0.6">0</text>
    <text x="195" y="16" font-family="monospace" font-size="8" fill="#5F7F93" opacity="0.6">200</text>
  </g>

  <!-- DC TET station identifiers — faint, in corners, like the film's station markings -->
  <g opacity="0.07">
    <!-- Upper-left: TET station mark -->
    <text x="80" y="80" font-family="Saira, Blender Trial, sans-serif" font-size="14" fill="#6FA8CC" letter-spacing="4" font-weight="600">TET</text>
    <text x="80" y="96" font-family="OCRA, monospace" font-size="8" fill="#5F7F93" letter-spacing="1">STATION 07</text>
    <!-- Lower-right: drone identifier -->
    <text x="4900" y="1360" font-family="Saira, Blender Trial, sans-serif" font-size="14" fill="#6FA8CC" letter-spacing="4" font-weight="600">DRN-166</text>
    <text x="4900" y="1376" font-family="OCRA, monospace" font-size="8" fill="#5F7F93" letter-spacing="1">ZONE 07 · GRID 12N</text>
  </g>

  <!-- Signal trace in lower-right -->
  <g transform="translate(3500, 1140)" opacity="0.1">
    <line x1="0" y1="30" x2="400" y2="30" stroke="#2C4A61" stroke-width="0.5"/>
    <g fill="#6FA8CC">
      <rect x="10" y="22" width="3" height="8"/>
      <rect x="18" y="18" width="3" height="12"/>
      <rect x="26" y="25" width="3" height="5"/>
      <rect x="34" y="20" width="3" height="10"/>
      <rect x="42" y="14" width="3" height="16"/>
      <rect x="50" y="24" width="3" height="6"/>
      <rect x="58" y="22" width="3" height="8"/>
      <rect x="66" y="16" width="3" height="14"/>
      <rect x="74" y="26" width="3" height="4"/>
      <rect x="82" y="20" width="3" height="10"/>
      <rect x="90" y="24" width="3" height="6"/>
      <rect x="98" y="18" width="3" height="12"/>
      <rect x="106" y="22" width="3" height="8"/>
      <rect x="114" y="26" width="3" height="4"/>
      <rect x="122" y="20" width="3" height="10"/>
      <rect x="130" y="24" width="3" height="6"/>
      <rect x="138" y="18" width="3" height="12"/>
      <rect x="146" y="22" width="3" height="8"/>
      <rect x="154" y="26" width="3" height="4"/>
      <rect x="162" y="20" width="3" height="10"/>
    </g>
    <g fill="#6FA8CC" opacity="0.5">
      <rect x="10" y="30" width="3" height="5"/>
      <rect x="18" y="30" width="3" height="3"/>
      <rect x="26" y="30" width="3" height="7"/>
      <rect x="34" y="30" width="3" height="3"/>
      <rect x="42" y="30" width="3" height="9"/>
      <rect x="50" y="30" width="3" height="4"/>
      <rect x="58" y="30" width="3" height="6"/>
      <rect x="66" y="30" width="3" height="10"/>
      <rect x="74" y="30" width="3" height="3"/>
      <rect x="82" y="30" width="3" height="7"/>
      <rect x="90" y="30" width="3" height="5"/>
      <rect x="98" y="30" width="3" height="9"/>
      <rect x="106" y="30" width="3" height="4"/>
      <rect x="114" y="30" width="3" height="3"/>
      <rect x="122" y="30" width="3" height="8"/>
      <rect x="130" y="30" width="3" height="5"/>
      <rect x="138" y="30" width="3" height="10"/>
      <rect x="146" y="30" width="3" height="4"/>
      <rect x="154" y="30" width="3" height="3"/>
      <rect x="162" y="30" width="3" height="7"/>
    </g>
    <circle cx="50" cy="30" r="0.8" fill="#A3CFE3"/>
    <circle cx="100" cy="30" r="0.8" fill="#A3CFE3"/>
    <circle cx="150" cy="30" r="0.8" fill="#A3CFE3"/>
    <line x1="50" y1="30" x2="50" y2="34" stroke="#2C4A61" stroke-width="0.3"/>
    <line x1="100" y1="30" x2="100" y2="34" stroke="#2C4A61" stroke-width="0.3"/>
    <line x1="150" y1="30" x2="150" y2="34" stroke="#2C4A61" stroke-width="0.3"/>
  </g>

  <!-- Vignette -->
  <rect width="5120" height="1440" fill="url(#vignette)"/>
</svg>
